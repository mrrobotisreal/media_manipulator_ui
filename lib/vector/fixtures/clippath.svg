<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <clipPath id="porthole" clipPathUnits="userSpaceOnUse">
    <circle cx="80" cy="80" r="60"/>
  </clipPath>
  <clipPath id="unit-clip" clipPathUnits="objectBoundingBox" transform="scale(0.5)">
    <rect width="1" height="1"/>
  </clipPath>
  <g clip-path="url(#porthole)">
    <rect width="160" height="80" fill="#1d4ed8"/>
    <rect y="80" width="160" height="80" fill="#facc15"/>
  </g>
  <rect x="10" y="10" width="40" height="40" fill="red" clip-path="url(#unit-clip)"/>
</svg>
