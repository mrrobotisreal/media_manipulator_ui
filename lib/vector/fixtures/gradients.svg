<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="150" viewBox="0 0 300 150">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="50%" style="stop-color:#feb47b;stop-opacity:0.8"/>
      <stop offset="1" stop-color="#6a3093"/>
    </linearGradient>
    <linearGradient id="sunset-tilted" xlink:href="#sunset" gradientTransform="rotate(45 0.5 0.5)"/>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3" spreadMethod="reflect">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="#003" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="140" height="150" fill="url(#sunset)"/>
  <rect x="150" y="0" width="70" height="70" fill="url('#sunset-tilted')"/>
  <circle cx="250" cy="100" r="45" fill="url(#glow)" stroke="url(#missing) red"/>
</svg>
