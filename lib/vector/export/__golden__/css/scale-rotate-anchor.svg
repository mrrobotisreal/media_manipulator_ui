<!-- Generated by Media Manipulator Motion -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes mm-box-transform {
      0% { transform: translate(80px, 80px) rotate(0deg) scale(1, 1) translate(-20px, -20px); animation-timing-function: cubic-bezier(0.3333,0,0.6667,0.3333); }
      50% { transform: translate(80px, 80px) rotate(180deg) scale(1.5, 0.75) translate(-20px, -20px); animation-timing-function: cubic-bezier(0.3333,0.6667,0.6667,1); }
      100% { transform: translate(80px, 80px) rotate(360deg) scale(2, 0.5) translate(-20px, -20px); }
    }
    #box {
      animation-name: mm-box-transform;
      animation-duration: 2000ms;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      transform-box: view-box;
      transform-origin: 0 0;
    }
  </style>
  <rect id="box" x="0" y="0" width="40" height="40" fill="#3b82f6" transform="translate(60 60)"/>
</svg>
