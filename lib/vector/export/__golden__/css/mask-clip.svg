<!-- Generated by Media Manipulator Motion -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes mm-spot-light-opacity {
      0% { opacity: 0.2; animation-timing-function: cubic-bezier(0.3333,0,0.6667,0.3333); }
      50% { opacity: 0.6; animation-timing-function: cubic-bezier(0.3333,0.6667,0.6667,1); }
      100% { opacity: 1; }
    }
    @keyframes mm-reveal-box-transform {
      0% { transform: translate(-200px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: cubic-bezier(0.3333,0.6667,0.6667,1); }
      75% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: linear; }
      100% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
    }
    #spot-light {
      animation-name: mm-spot-light-opacity;
      animation-duration: 2000ms;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    #reveal-box {
      animation-name: mm-reveal-box-transform;
      animation-duration: 2000ms;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      transform-box: view-box;
      transform-origin: 0 0;
    }
  </style>
  <defs>
    <mask id="spot">
      <circle id="spot-light" cx="100" cy="100" r="40" fill="#ffffff" opacity="0.2"/>
    </mask>
    <clipPath id="reveal">
      <rect id="reveal-box" x="0" y="0" width="200" height="60" transform="translate(-200 0)"/>
    </clipPath>
  </defs>
  <rect id="photo" x="0" y="0" width="200" height="200" fill="#14b8a6" mask="url(#spot)"/>
  <rect id="wipe" x="0" y="0" width="200" height="200" fill="#f43f5e" clip-path="url(#reveal)"/>
</svg>
