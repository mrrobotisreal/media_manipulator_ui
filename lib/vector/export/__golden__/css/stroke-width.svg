    }
    #stem {
      animation-name: mm-stem-strokeWidth, mm-stem-stroke;
      animation-duration: 2000ms;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
  </style>
  <line id="stem" x1="20" y1="100" x2="180" y2="100" stroke="none" stroke-width="1"/>
