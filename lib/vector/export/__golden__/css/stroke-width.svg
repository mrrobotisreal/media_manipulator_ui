<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes mm-stem-strokeWidth {
      0% { stroke-width: 1px; animation-timing-function: linear; }
      50% { stroke-width: 12px; animation-timing-function: cubic-bezier(0.3333,0.6667,0.6667,1); }
