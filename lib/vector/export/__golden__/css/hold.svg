<!-- Generated by Media Manipulator Motion -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes mm-box-transform {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: steps(1,end); }
      50% { transform: translate(100px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: linear; }
      100% { transform: translate(150px, 0px) rotate(0deg) scale(1, 1); }
    }
    @keyframes mm-box-fill {
      0% { fill: #ff0000; animation-timing-function: steps(1,end); }
      50% { fill: #00ff00; animation-timing-function: linear; }
      100% { fill: #00ff00; }
    }
    #box {
      animation-name: mm-box-transform, mm-box-fill;
      animation-duration: 2000ms;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      transform-box: view-box;
      transform-origin: 0 0;
    }
  </style>
  <rect id="box" x="0" y="0" width="40" height="40" fill="#ff0000"/>
</svg>
